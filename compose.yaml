# mini8n — une image par partie :
#   engine  (build Rust → wasm, artefact consommé par web)
#   db      (PostgreSQL, réseau interne sans accès extérieur)
#   server  (API Rust, réseau interne)
#   web     (nginx non-root : interface + reverse proxy /api)
#   connectors (Node non-root : pilote Oracle « thin », joignable par l'API seulement)
#   proxy   (Caddy, TLS automatique — profil optionnel « tls »)
#   backup  (pg_dump périodique vers le volume db-backups ; voir scripts/backup.sh, restore.sh)
#
# Démarrage : ./scripts/init-secrets.sh && docker compose up -d --build
# Production (images publiées par la CI, voir docs/TECHNIQUE.md « Mises à jour ») :
#   MINI8N_REGISTRY=ghcr.io/<compte>/mini8n MINI8N_VERSION=1.2.0 dans .env, puis
#   docker compose pull && docker compose up -d --no-build
name: mini8n

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  engine:
    build:
      context: .
      dockerfile: crates/engine/Dockerfile
    image: ${MINI8N_REGISTRY:-mini8n}/engine:${MINI8N_VERSION:-local}
    # Image d'artefact (wasm) : construite mais jamais exécutée.
    scale: 0

  db:
    <<: *hardening
    image: postgres:18-alpine
    user: "70:70"
    environment:
      POSTGRES_USER: mini8n
      POSTGRES_DB: mini8n
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql:mode=0770,uid=70,gid=70
      - /tmp:mode=1777
    shm_size: 128m
    networks: [data]
    pids_limit: 200
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini8n -d mini8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    <<: *hardening
    image: postgres:18-alpine
    user: "70:70"
    entrypoint: ["/bin/sh", "/backup.sh"]
    command: []
    environment:
      PGHOST: db
      PGUSER: mini8n
      PGDATABASE: mini8n
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    secrets: [db_password]
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - db-backups:/var/lib/postgresql
    tmpfs:
      - /tmp:mode=1777
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    pids_limit: 50
    mem_limit: 512m

  server:
    <<: *hardening
    build:
      context: .
      dockerfile: crates/server/Dockerfile
    image: ${MINI8N_REGISTRY:-mini8n}/server:${MINI8N_VERSION:-local}
    environment:
      DATABASE_HOST: db
      DATABASE_USER: mini8n
      DATABASE_NAME: mini8n
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # E-mails de la plateforme (mot de passe oublié, invitations) : facultatif.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Supervision : /api/metrics (Prometheus) accessible avec ce jeton (32 caractères min.).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      TRUST_PROXY: "true"
      RUST_LOG: ${RUST_LOG:-info,tower_http=info,sqlx=warn}
      # Exécution des workflows (déclencheurs automatiques).
      RUNNER_THREADS: ${RUNNER_THREADS:-4}
      EXECUTION_TIMEOUT_SECS: ${EXECUTION_TIMEOUT_SECS:-300}
      EXECUTIONS_RETENTION_DAYS: ${EXECUTIONS_RETENTION_DAYS:-30}
      # Les nœuds HTTP côté serveur ne peuvent joindre que des adresses publiques (anti-SSRF).
      HTTP_ALLOW_PRIVATE: "false"
      # Hôtes / réseaux privés autorisés pour les intégrations (ex. "erp.interne,10.20.0.0/16").
      NETWORK_ALLOWLIST: ${NETWORK_ALLOWLIST:-}
      # Dans un conteneur, « localhost » serait le serveur lui-même : redirigé vers la
      # machine hôte (à autoriser explicitement dans NETWORK_ALLOWLIST).
      LOCALHOST_ALIAS: ${LOCALHOST_ALIAS:-host.docker.internal}
      CREDENTIALS_KEY_FILE: /run/secrets/credentials_key
      CONNECTORS_URL: http://connectors:8090
      CONNECTORS_TOKEN_FILE: /run/secrets/connectors_token
    secrets: [db_password, credentials_key, connectors_token]
    # host.docker.internal = machine hôte, aussi sous Linux (Docker ≥ 20.10).
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: { condition: service_healthy }
      connectors: { condition: service_healthy }
    # egress : accès sortant pour les nœuds HTTP, la surveillance d'API et les intégrations
    # (adresses privées bloquées sauf NETWORK_ALLOWLIST).
    networks: [data, backend, egress, connectors]
    pids_limit: 200
    mem_limit: 1g
    cpus: 2

  connectors:
    <<: *hardening
    build:
      context: ./connectors
    image: ${MINI8N_REGISTRY:-mini8n}/connectors:${MINI8N_VERSION:-local}
    environment:
      CONNECTORS_TOKEN_FILE: /run/secrets/connectors_token
    secrets: [connectors_token]
    tmpfs:
      - /tmp:mode=1777,size=16m
    # connectors : joignable par l'API uniquement ; egress : vers les bases Oracle.
    networks: [connectors, egress]
    pids_limit: 100
    mem_limit: 512m

  web:
    <<: *hardening
    build:
      context: ./web
      additional_contexts:
        engine: service:engine
    image: ${MINI8N_REGISTRY:-mini8n}/web:${MINI8N_VERSION:-local}
    environment:
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-https:}
    ports:
      # Par défaut, uniquement sur la machine locale. Mettre WEB_BIND=0.0.0.0 pour exposer.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    tmpfs:
      - /tmp:mode=1777,size=64m
    depends_on:
      server: { condition: service_healthy }
    networks: [backend, edge, tls]
    pids_limit: 100
    mem_limit: 256m

  proxy:
    <<: *hardening
    profiles: [tls]
    image: caddy:2.11-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    depends_on:
      web: { condition: service_healthy }
    networks:
      tls:
        ipv4_address: 172.30.250.10
    pids_limit: 100
    mem_limit: 256m

networks:
  data:
    internal: true
  backend:
    internal: true
  edge: {}
  egress: {}
  connectors:
    internal: true
  tls:
    ipam:
      config:
        - subnet: 172.30.250.0/24

secrets:
  db_password:
    file: ./secrets/db_password.txt
  credentials_key:
    file: ./secrets/credentials_key.txt
  connectors_token:
    file: ./secrets/connectors_token.txt

volumes:
  db-data:
  db-backups:
  caddy-data:
  caddy-config:
