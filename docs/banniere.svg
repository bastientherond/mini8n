<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="0.55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grille" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e0a4a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="300" rx="20" fill="url(#fond)"/>
  <rect width="960" height="300" rx="20" fill="url(#grille)"/>

  <!-- Logo + titre -->
  <g transform="translate(56 78)">
    <rect width="56" height="56" rx="13" fill="#ffffff" fill-opacity="0.14"/>
    <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(1.75)">
      <rect x="7" y="7" width="7" height="7" rx="1.5"/>
      <rect x="18" y="18" width="7" height="7" rx="1.5"/>
      <path d="M10.5 14v4a3 3 0 0 0 3 3H18"/>
    </g>
  </g>
  <text x="128" y="124" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">mini8n</text>
  <text x="58" y="182" font-size="24" font-weight="600" fill="#ffffff">Automatisez vos tâches répétitives,</text>
  <text x="58" y="214" font-size="24" font-weight="600" fill="#c4b5fd">sans écrire une ligne de code.</text>
  <text x="58" y="254" font-size="15" fill="#ddd6fe" fill-opacity="0.85">Glissez des blocs, reliez-les, et laissez tourner.</text>

  <!-- Mini workflow illustré -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M662 92 H700 Q712 92 712 104 V138 Q712 150 724 150 H744" stroke="#22d3ee"/>
    <path d="M662 212 H700 Q712 212 712 200 V162 Q712 150 724 150 H744" stroke="#4ade80"/>
    <path d="M832 150 H858" stroke="#fbbf24"/>
  </g>

  <g filter="url(#ombre)">
    <!-- Déclencheur -->
    <g transform="translate(562 62)">
      <rect width="100" height="60" rx="12" fill="#ffffff"/>
      <rect width="100" height="60" rx="12" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="50" cy="24" r="10" fill="none" stroke="#0891b2" stroke-width="2.5"/>
      <path d="M50 18 V24 L54 27" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round"/>
      <text x="50" y="50" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">Chaque jour</text>
    </g>
    <!-- Source -->
    <g transform="translate(562 182)">
      <rect width="100" height="60" rx="12" fill="#ffffff"/>
      <rect width="100" height="60" rx="12" fill="none" stroke="#4ade80" stroke-width="2.5"/>
      <g fill="none" stroke="#16a34a" stroke-width="2.5">
        <ellipse cx="50" cy="16" rx="11" ry="4"/>
        <path d="M39 16 V30 Q50 36 61 30 V16"/>
      </g>
      <text x="50" y="50" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Base de données</text>
    </g>
    <!-- Transformation -->
    <g transform="translate(744 120)">
      <rect width="88" height="60" rx="12" fill="#ffffff"/>
      <rect width="88" height="60" rx="12" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
      <path d="M30 14 H58 L48 26 V36 L40 32 V26 Z" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="44" y="51" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">Filtrer</text>
    </g>
    <!-- Envoi -->
    <g transform="translate(858 120)">
      <rect width="60" height="60" rx="12" fill="#ffffff"/>
      <rect width="60" height="60" rx="12" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <g fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round">
        <rect x="16" y="14" width="28" height="20" rx="3"/>
        <path d="M16 16 L30 26 L44 16"/>
      </g>
      <text x="30" y="51" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">E-mail</text>
    </g>
  </g>

  <!-- Petits compteurs de lignes sur les liens -->
  <g font-size="10" font-weight="700" text-anchor="middle">
    <rect x="684" y="74" width="30" height="16" rx="8" fill="#22d3ee"/>
    <text x="699" y="86" fill="#083344">1</text>
    <rect x="684" y="214" width="34" height="16" rx="8" fill="#4ade80"/>
    <text x="701" y="226" fill="#052e16">250</text>
  </g>
</svg>
