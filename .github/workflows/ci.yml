name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98"
  WASM_BINDGEN_VERSION: "0.2.129"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mini8n
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: mini8n_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mini8n -d mini8n_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p mini8n-engine --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          TEST_DATABASE_URL: postgres://mini8n:ci-only@localhost:5432/mini8n_test

  web:
    name: Interface (wasm, svelte-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: ./scripts/build-wasm.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx svelte-check --tsconfig ./tsconfig.app.json --fail-on-warnings
          npm test
          npx vite build

  connectors:
    name: Connecteurs (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: connectors/package-lock.json
      - working-directory: connectors
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [rust, web, connectors]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: ./scripts/init-secrets.sh
      - run: docker compose config --quiet
      - run: docker compose build
