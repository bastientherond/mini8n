[workspace]
resolver = "3"
members = ["crates/engine", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1

# Le serveur privilégie la vitesse (le moteur wasm, la taille).
[profile.release.package.mini8n-server]
opt-level = 3
