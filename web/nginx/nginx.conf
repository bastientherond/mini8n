worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # Protection contre les connexions lentes et les requêtes démesurées.
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 2m;
    client_body_buffer_size 64k;
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration":$request_time,"ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    # Limitation de débit par IP (en plus de celle de l'API).
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Seul le reverse proxy TLS optionnel (IP fixe dans compose.yaml) peut fournir l'IP réelle.
    set_real_ip_from 172.30.250.10;
    real_ip_header X-Forwarded-For;

    # Protocole d'origine : celui annoncé par le proxy TLS de confiance, sinon celui de nginx.
    # (Un client direct ne peut donc pas se faire passer pour une connexion HTTPS.)
    map $realip_remote_addr $forwarded_proto {
        172.30.250.10 $http_x_forwarded_proto;
        default       $scheme;
    }

    include /tmp/*.conf;
}
